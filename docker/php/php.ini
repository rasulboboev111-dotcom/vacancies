; Production PHP tuning for the HR portal app container.

memory_limit = 512M
upload_max_filesize = 20M
post_max_size = 25M
max_execution_time = 120

expose_php = Off

; OPcache — compile once, keep in memory. validate_timestamps Off means a deploy
; (new image) is required to pick up code changes, which is the intended prod behaviour.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
