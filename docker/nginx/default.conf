server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 25M;

    # Static files are served by nginx; everything else falls through to Laravel.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # PHP files live in the app container; pass the request to php-fpm there.
        fastcgi_pass app:9000;
        fastcgi_buffers 64 64k;
        fastcgi_buffer_size 64k;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        include fastcgi_params;
    }

    # Don't leak hidden files (e.g. .env, .git) if any slip into public/.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
