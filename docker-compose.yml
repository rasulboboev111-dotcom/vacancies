# Production stack for the HR portal (Laravel 12 + Inertia/Vue).
# Bring it up with:  docker compose up -d --build   →  http://localhost:8080
#
# Configuration comes from the project .env (env_file below). DB_HOST and a few
# service-coupled values are overridden here so they point at the compose
# network instead of localhost — your .env stays valid for native local runs.

services:
  app:
    build:
      context: .
      target: app
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db # override .env localhost → db service
      RUN_MIGRATIONS: "true"
    volumes:
      - storage_logs:/var/www/html/storage/logs
      - public_assets:/var/www/html/public # app publishes built assets here
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "9000"
    networks:
      - vacancies_network:

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - public_assets:/var/www/html/public:ro # served by nginx, filled by app
    depends_on:
      - app
    ports:
      - "8070:80"
    networks:
      - vacancies_network:

  # Background worker — runs queued jobs (org-structure import).
  queue-worker:
    build:
      context: .
      target: app
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_QUEUE_RETRY_AFTER: "1900" # must exceed --timeout below
    command: php artisan queue:work --tries=1 --timeout=1800 --sleep=5 --max-time=3600
    volumes:
      - storage_logs:/var/www/html/storage/logs
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - vacancies_network:

  scheduler:
    build:
      context: .
      target: app
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
    volumes:
      - storage_logs:/var/www/html/storage/logs
    command: php artisan schedule:work
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - vacancies_network:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-vacancies}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-vacancies}"]
      interval: 5s
      timeout: 5s
      retries: 10
    expose:
      - "5432"
    networks:
      - vacancies_network:

volumes:
  pgdata:
  storage_logs:
  public_assets:

networks:
  vacancies_network:
    driver: bridge
